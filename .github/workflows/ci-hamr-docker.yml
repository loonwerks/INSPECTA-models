name: hamr-codegen-docker

# The build inside the published container.  Every tool it builds against --
# Verus, the Microkit SDK, LionsOS, sdfgen, Rust -- is the version baked into
# jasonbelt/microkit_provers when that image was last published, not whatever
# provers-env/bin/versions.sh pins today; the image is rebuilt and pushed as its
# own step.  Sireum is the one exception: the image's copy is discarded and
# kekinian is checked out at the current master tip and built, so what this
# tests is today's codegen against a fixed environment.
#
# Which is why provers-env/** is not among the triggers -- a change to it cannot
# reach this job.  ci-hamr-linux.yml and ci-hamr-mac.yml install the environment
# from provers-env/provers-setup.sh onto the runner instead, so they are what
# tests the scripts, and running both is what keeps the two deliveries of one
# environment from drifting apart.

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'micro-examples/**'
      - 'isolette/**'
      - 'open-platform-models/isolate-ethernet-simple/**'
      # the environment the models are built against, installed onto the runner
      # by ci-hamr-linux.yml and ci-hamr-mac.yml straight from this checkout
      - 'provers-env/**'
  schedule:
    - cron: "0 2 * * 6" # every sunday at 2am

jobs:
  ci:
    runs-on: ubuntu-latest
    container: 
      image: jasonbelt/microkit_provers:latest
      credentials:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Shards are balanced against per-model wall times measured from the 2026-09-15 run.
          # isolette is ~70 min -- 41% of all model time and 4.8x the next largest -- so it runs
          # alone and sets the floor for the matrix: adding rows cannot bring the run in under it.
          # The other three land near 35 min each, so they have slack and need no fine balancing.
          #
          # The 'rest' shard names what the other shards cover rather than listing its own models,
          # so a model added to the repo is picked up here automatically instead of going untested.
          - name: isolette        # ~70 min
            models: |
              isolette
          - name: verification    # ~37 min
            models: |
              micro-examples/microkit/system-verification/temp-control
              open-platform-models/firewall-simple-byte-array
              micro-examples/microkit/r2u2_monitor/r2u2_component_monitor
          - name: r2u2-gumbo      # ~35 min
            models: |
              micro-examples/microkit/r2u2_monitor/r2u2_system_monitor
              micro-examples/microkit/r2u2_monitor/r2u2_exhaustive_monitor
              micro-examples/microkit/gumbo-verus/structs_arrays
              micro-examples/microkit/gumbo-verus/pure_event_port
          - name: rest            # ~29 min
            skip: |
              isolette
              micro-examples/microkit/system-verification/temp-control
              open-platform-models/firewall-simple-byte-array
              micro-examples/microkit/r2u2_monitor/r2u2_component_monitor
              micro-examples/microkit/r2u2_monitor/r2u2_system_monitor
              micro-examples/microkit/r2u2_monitor/r2u2_exhaustive_monitor
              micro-examples/microkit/gumbo-verus/structs_arrays
              micro-examples/microkit/gumbo-verus/pure_event_port
    name: hamr-codegen-docker (${{ matrix.name }})
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: INSPECTA-models
          submodules: recursive
          ref: main
          fetch-depth: 1
          fetch-tags: false
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: Sireum
          repository: sireum/kekinian
          submodules: recursive
          ref: master
          fetch-depth: 1
          fetch-tags: false
      - name: Cache Java
        id: cache-java
        uses: actions/cache@v4
        with:
          path: Sireum/bin/linux/java
          key: ${{ runner.os }}-${{ hashFiles('Sireum/versions.properties') }}-java
      - name: Cache Scala
        id: cache-scala
        uses: actions/cache@v4
        with:
          path: Sireum/bin/scala
          key: ${{ runner.os }}-${{ hashFiles('Sireum/versions.properties') }}-scala
      - name: Cache Coursier
        id: cache-coursier
        uses: actions/cache@v4
        with:
          path: Sireum/cache/coursier
          key: ${{ runner.os }}-${{ hashFiles('Sireum/versions.properties') }}-coursier
      - name: Cache FMIDE
        id: cache-fmide
        uses: actions/cache@v4
        with:
          path: Sireum/bin/linux/fmide
          key: ${{ runner.os }}-${{ hashFiles('Sireum/bin/install/fmide*') }}-fmide
      # TEMPORARY -- remove once jasonbelt/microkit_provers:latest is rebuilt with
      # the xxd added to provers-env/bin/deps.sh. The generated R2U2 C monitors'
      # makefiles convert spec.bin into a C array with 'xxd -i -n', and the published
      # image predates that requirement, so every microkit_mcs_c build fails with
      # 'xxd: not found' (make exit 127). Kept separate from the Build step so that
      # deleting it later is a clean revert.
      - name: Install xxd (until the image carries it)
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y xxd
      - name: Build
        shell: bash
        env:
          # Empty for a shard that does not set them; the driver treats blank as unset.
          HAMR_CI_MODELS: ${{ matrix.models }}
          HAMR_CI_SKIP_MODELS: ${{ matrix.skip }}
        run: |
          rm -rf INSPECTA-models/.git # free up disk space
          
          export HOME=/home/microkit
          # The image's own environment, rather than a copy of it that has to be
          # kept in step by hand -- MICROKIT_SDK in particular names the SDK
          # version, and this went stale when the environment moved to a single
          # Microkit 2.3.0 SDK.
          source ${HOME}/bin/env.sh
          
          rm -rf ${PROVERS_DIR}/Sireum # the master checkout below replaces it
          export SIREUM_HOME=$(pwd)/Sireum
          export PATH=${SIREUM_HOME}/bin:${PATH}

          # 'setup' rather than 'jar': 'jar' only builds sireum.jar, whereas setup is that plus
          # init.deps() and init.distro(buildIve = T) -- see kekinian's bin/build.cmd. Two things
          # depend on the difference. HAMR codegen ends by running `proyek ive` over the generated
          # Slang project, and each model's run-hamr.cmd only passes --no-proyek-ive when
          # hamr/slang/.idea already exists, which it never does on a fresh CI checkout -- so
          # JVM-platform models fail with "Sireum IVE is not installed". init.deps() also pulls
          # the Logika and proyek-compile dependencies that later steps need.
          ${SIREUM_HOME}/bin/build.cmd setup
          rm -rf ${SIREUM_HOME}/.git
          rm -rf ${SIREUM_HOME}/out
          
          sireum -v
          
          ${SIREUM_HOME}/bin/install/fmide.cmd -v

          git clone --depth 1 https://github.com/santoslab/sysml-aadl-libraries.git sysml-aadl-libraries
          export SYSML_AADL_LIBRARIES=$(pwd)/sysml-aadl-libraries

          INSPECTA-models/.github/workflows/hamr/hamr-ci.cmd
