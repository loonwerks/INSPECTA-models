# This file will not be overwritten if HAMR codegen is rerun

[package]
name = "ArduPilot_ArduPilot"
version = "0.1.0"
edition = "2021"

[dependencies]
data = { path = "../data" }
linux-raw-sys = { version = "=0.12.1", default-features = false }
log = "0.4.34"

# -----------------------------------------------------------------------------
# seL4 Rust crate dependencies
# -----------------------------------------------------------------------------
sel4 = { git = "https://github.com/seL4/rust-sel4", features = ["single-threaded"], optional = true, tag="v5.0.0" }
sel4-logging = { git = "https://github.com/seL4/rust-sel4", optional = true, tag="v5.0.0" }

# -----------------------------------------------------------------------------
# Verus crate dependencies
#
# It is recommended to use the Verus release:
# https://github.com/verus-lang/verus/releases/tag/release/0.2026.10.26.d17fbd0
# -----------------------------------------------------------------------------
vstd = { version = "=0.0.0-2026-10-25-0158", default-features=false }
verus_builtin = { version = "=0.0.0-2026-10-11-0230" }
verus_builtin_macros = { version = "=0.0.0-2026-10-25-0158" }

# PLACEHOLDER MARKER R2U2 CARGO DEPENDENCIES

[dev-dependencies]
lazy_static = "1.5.1"
once_cell = "1.21.4"
serial_test = "4.0.1"
proptest = "1.12.0"
env_logger = "0.11.11"

[lib]
path = "src/lib.rs"
crate-type = ["staticlib"]

[features]
sel4 = ["dep:sel4", "dep:sel4-logging" ]

[package.metadata.verus]
verify = true

